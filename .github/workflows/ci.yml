name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref makes the running check moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version pin here on purpose: with no "version" input, action-setup
      # reads the pnpm version from the "packageManager" field in package.json,
      # so that field stays the single source of truth for every surface.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      # Covers what tsc cannot see. The rule that earns this step is
      # react-hooks/exhaustive-deps: a dependency missing from a popup effect
      # typechecks, renders, and passes every unit test that renders once.
      # --format github turns each finding into an inline annotation on the PR.
      - name: Lint
        run: pnpm lint --format github

      - name: Typecheck
        run: pnpm typecheck

      # Unused files, exports and dependencies. The entry points are named in
      # knip.json, since an extension's are its manifest's, not package.json's.
      - name: Unused code
        run: pnpm knip

      # With coverage, so the thresholds in vitest.config.ts are enforced.
      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Builds the Firefox target and runs web-ext lint over it. Gecko rejects
      # manifest keys Chrome accepts, so without this the second target can
      # break on a change that leaves the Chrome build perfectly healthy.
      - name: Lint Firefox package
        run: pnpm lint:firefox

  # The Playwright suite, against the built extension in a real Chromium.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version input: the action reads package.json's packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite loads the unpacked MV3 build through a persistent context,
      # which needs a real Chromium rather than the bundled headless shell.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # scripts/chromium-path.mjs prefers a system Chromium, and the runner
      # ships one built without H.264, so /playing's MP4 never decodes there.
      # Playwright's build does decode it.
      - name: Use Playwright's Chromium
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(node -e "import('@playwright/test').then(m => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"

      - name: Run end-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Commit messages carry no AI attribution; the rules live in
  # .github/cchk.toml and the disclosure goes in the pull request instead.
  commit-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit messages
        uses: commit-check/commit-check-action@d68e05baf9511853193e2749f8a64bf2a221619a # v2.22.0
        with:
          message: true
          branch: false
