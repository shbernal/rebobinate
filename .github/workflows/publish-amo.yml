name: Publish addons.mozilla.org

on:
  release:
    types: [published]

# Write access is the attach job's alone, so dependency install scripts and the
# step holding the AMO secret never hold a token that can write the repo.
permissions:
  contents: read

# AMO's rate limits are spent per account, and a run only knows what it spent
# itself. Two runs at once would collide into 429s that still bill the counters.
concurrency:
  group: publish-amo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: addons-mozilla-org

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      # No version pin here on purpose: with no "version" input, action-setup
      # reads the pnpm version from the "packageManager" field in package.json,
      # so that field stays the single source of truth for every surface.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No format check: CI ran it on the way in, and a formatting nit failing a
      # release that is already published has no retry but the same failure.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify release tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"

          if [ "$version" != "$tag" ]; then
            echo "package.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      # HEAD is the release tag here, so archiving HEAD archives the tag. Run it
      # before the build so the archive cannot pick up build output.
      - name: Package source
        run: pnpm package:source

      - name: Build and package Firefox extension
        run: pnpm package:firefox

      - name: Lint Firefox package
        run: pnpm exec web-ext lint --source-dir dist-firefox

      - name: Record package paths
        run: |
          version="$(node -p "require('./package.json').version")"

          {
            echo "PACKAGE_ZIP=release/rebobinate-firefox-${version}.zip"
            echo "SOURCE_ZIP=release/rebobinate-source-${version}.zip"
          } >> "$GITHUB_ENV"

      # Uploads the package, waits for AMO validation, creates the version with
      # the reviewer notes, and attaches the source archive AMO requires for
      # bundler-built add-ons. A listed version is queued for human review, so
      # the step succeeds on "awaiting review" and never waits for "public".
      - name: Submit to addons.mozilla.org
        env:
          MOZILLA_ADDON_JWT_ISSUER: ${{ secrets.MOZILLA_ADDON_JWT_ISSUER }}
          MOZILLA_ADDON_JWT_SECRET: ${{ secrets.MOZILLA_ADDON_JWT_SECRET }}
        run: pnpm publish:amo

      - name: Hand the packages to the attach job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amo-packages
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.SOURCE_ZIP }}
          if-no-files-found: error

  attach:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: amo-packages
          path: packages

      - name: Attach packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" packages/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
